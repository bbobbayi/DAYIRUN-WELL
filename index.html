<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ddd1f3"><title>DAYIRUN WELL v1.8</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#1b3932;background:#f4f6f0}*{box-sizing:border-box}body{margin:0}header{background:#193f35;color:#fff;padding:28px max(18px,calc((100vw - 940px)/2));}header .eyebrow{font-size:12px;letter-spacing:.19em;color:#bbdca5;font-weight:800}header h1{font-size:31px;margin:7px 0}header p{margin:0;color:#d5e3da}.shell{max-width:940px;margin:auto;padding:15px}nav{display:flex;gap:7px;overflow-x:auto;padding:5px 0 16px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:#214b3e;color:white;padding:11px 16px;font-weight:700}button.secondary{background:#e4ebe3;color:#234438}button.active{background:#173e33;color:#fff}.nav{white-space:nowrap}section{background:white;border:1px solid #dfe7de;border-radius:20px;padding:22px;margin-bottom:15px;box-shadow:0 3px 12px #193f3510}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px;margin:12px 0}p{line-height:1.6}.muted{color:#6d7c74;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#edf3e8;padding:15px;border-radius:14px}.stat b{display:block;font-size:22px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.drill{display:flex;align-items:center;gap:10px;font-weight:650}.drill input{width:20px;height:20px;accent-color:#7755a6}label{display:block;font-size:13px;font-weight:750;margin:9px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd8cc;border-radius:10px;background:#fff;color:#163a2b}textarea{min-height:75px;resize:vertical}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.entry{padding:13px 0;border-bottom:1px solid #e7ece7}.entry:last-child{border:0}.entry-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.delete{background:#fae8e6;color:#9b4540;padding:6px 11px}.good{color:#287754}.hide{display:none}.pill{background:#eaf2e6;padding:7px 10px;border-radius:20px;font-size:12px;display:inline-block;margin:3px}.note{background:#eef5e9;padding:13px;border-left:4px solid #6da582;border-radius:10px}.chart{width:100%;height:230px;border:1px solid #e4ede2;border-radius:12px;background:#fff}.chart text{font-size:11px;fill:#65776b}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border-radius:11px;background:#eef2ec;min-height:72px;padding:8px 5px;font-size:12px}.day.mark{background:#d9eed4}.day small{display:block;font-size:10px;color:#4a6657;margin-top:4px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{flex:1}strong{font-weight:750}@media(max-width:500px){.grid{grid-template-columns:1fr}.stats .stat{padding:10px}.stat b{font-size:17px}section{padding:16px}.shell{padding:10px}.week{gap:3px}.day{min-height:65px;padding:5px 3px;font-size:11px}}

</style></head><body><header><h1>DAYIRUN WELL v1.8</h1></header><main class="shell"><nav id="tabs"></nav><div id="screen"></div></main><script>
'use strict';const KEY='daywell-health-v1';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const empty=()=>({activities:[],weights:[],meals:[],bathroom:[],daily:{},settings:{targetWeight:55,festivalMonth:"2027-06",festivalName:"쉬엄쉬엄 한강 3종 축제",otherEvent:"한크스 · 한강 리버크로스 스위밍 챌린지"}});let db;try{db={...empty(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){db=empty()};db.settings={...empty().settings,...(db.settings||{})};db.bathroom=Array.isArray(db.bathroom)?db.bathroom:[];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('저장하지 못했습니다. 브라우저 저장공간을 확인해 주세요.')}};const tabs=[['today','오늘'],['activity','운동 기록'],['weight','체중 그래프'],['meal','식사 일기'],['bathroom','오늘의 비움'],['calendar','달력'],['backup','설정·백업']];let active='today',month=today().slice(0,7);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=(v,units='')=>Number.isFinite(v)?v.toFixed(1).replace(/\.0$/,'')+units:'—';const pretty=d=>d?.replaceAll('-','. ');const countRecent=(a,days)=>{const cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-days+1);return a.filter(x=>new Date(x.date+'T12:00:00')>=cutoff && new Date(x.date+'T12:00:00')<=new Date())};function nav(){ $('#tabs').innerHTML=tabs.map(([id,label])=>`<button class="nav ${active===id?'active':'secondary'}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()})}function render(){nav();$('#screen').innerHTML=({today:todayPage,activity:activityPage,weight:weightPage,meal:mealPage,bathroom:bathroomPage,calendar:calendarPage,backup:backupPage}[active])();bind()}
function scheduleFor(day){const week=new Date(day+'T12:00:00').getDay();return ({0:[],1:[['수영','06:00','고정'],['요가','21:00~22:00','고정']],2:[['슬로조깅','06:00','계획']],3:[['수영','06:00','고정'],['요가','21:00~22:00','고정']],4:[['슬로조깅','06:00','계획']],5:[['수영','06:00','고정']],6:[]})[week]||[]}
const meditationQuotes=["오늘은 조금 천천히 가도 괜찮아. 네 속도가 가장 소중해.", "잠깐 멈춰서 숨을 쉬어 봐. 지금 이 순간도 충분해.", "누구의 속도와도 비교하지 말고 너의 하루를 걸어가자.", "몸이 쉬고 싶다고 하면 오늘은 그 목소리를 들어주자.", "지금 여기 있는 너에게 다정하게 인사해 보자.", "잘한 일 하나만 떠올려 봐. 그걸로 오늘도 충분해.", "작은 선택 하나가 오늘을 조금 따뜻하게 바꿀 수 있어.", "할 수 있는 만큼만 해도 돼. 꾸준함은 그렇게 자라나.", "마음이 복잡하면 내쉬는 숨에 걱정을 살짝 실어 보내자.", "바쁜 하루에도 네 마음이 쉴 자리를 남겨 두자.", "힘을 조금 풀어도 괜찮아. 삶은 달리기 시합이 아니야.", "어제와 다른 오늘을 꼭 증명하지 않아도 돼.", "오늘 너에게 필요한 건 완벽함보다 다정함일 거야.", "물결처럼 흔들려도 괜찮아. 다시 고요해질 수 있으니까.", "오늘만큼은 너 자신에게 따뜻한 말을 하나 해주자.", "짧은 쉼도 내일의 힘이 돼. 편히 쉬어도 좋아.", "생각이 많을 땐 숨 한 번에만 집중해 보자.", "천천히 쌓인 하루들이 너만의 리듬이 될 거야.", "잠시 멈추는 건 포기가 아니야. 다음 걸음을 준비하는 거지.", "오늘도 움직여 준 네 몸에게 고맙다고 말해 보자.", "모든 걸 한꺼번에 바꾸려고 애쓰지 않아도 돼.", "잘 쉬는 것도 스스로를 돌보는 중요한 일이야.", "오늘은 네 몸과 마음에 맞는 속도를 골라 보자.", "숨을 내쉬면서 어깨에 들어간 힘을 조금 놓아 보자.", "평범한 하루에도 작고 반짝이는 기쁨이 숨어 있어.", "너를 돌보는 시간은 결코 아까운 시간이 아니야.", "작은 실천 하나를 오늘의 선물처럼 받아 보자.", "챙길 일이 많아도 너 자신을 잊지는 말자.", "오늘 몸 상태를 평가하지 말고 그저 알아차려 보자.", "서툰 순간에도 배우는 게 있어. 조급해하지 말자.", "고요함은 멀리 있지 않아. 지금 내쉬는 숨에도 있어.", "남의 박자 말고 네 하루의 박자를 찾아 보자.", "마음이 급할수록 눈앞의 작은 풍경을 바라봐 줘.", "오늘 하루 한 번쯤은 너에게 미소 지어 주자.", "여기까지 온 너에게 수고했다고 말해 주고 싶어."];function dailyMeditation(){const day=Math.floor(Date.UTC(...today().split("-").map((v,i)=>i===1?Number(v)-1:Number(v)))/86400000);const quote=meditationQuotes[((day%meditationQuotes.length)+meditationQuotes.length)%meditationQuotes.length];return `<section class="meditation"><div class="meditation-tag">🪻 오늘의 명상 · ${pretty(today())}</div><p class="meditation-quote">“${esc(quote)}”</p></section>`;}
function todayPage(){const w=[...db.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];const acts=countRecent(db.activities,7);const mins=acts.reduce((s,x)=>s+Number(x.minutes||0),0);const d=db.daily[today()]||{};const scheduled=scheduleFor(today());const routines=[...new Set([...scheduled.map(x=>x[0]),'슬로조깅','접영 지상훈련','가벼운 스트레칭'])];return `${dailyMeditation()}<section><h2>오늘의 건강 체크</h2><p class="muted">${pretty(today())}</p><div class="stats"><div class="stat">최근 7일 운동<b>${n(mins,'분')}</b></div><div class="stat">최근 7일 운동횟수<b>${acts.length}회</b></div><div class="stat">최근 체중<b>${w?n(w.kg,'kg'):'미입력'}</b></div></div></section><section><h2>오늘의 운동 일정</h2>${scheduled.length?scheduled.map(x=>`<div class="entry"><strong>${esc(x[0])}</strong> · ${esc(x[1])} <span class="pill">${esc(x[2])}</span></div>`).join(''):'<p class="muted">정해진 운동이 없는 날이에요. 충분히 쉬거나 가볍게 움직여도 좋아요.</p>'}</section><section><h2>🏊 접영 지상훈련 · 3종 체크</h2><div class="entry"><strong>① 접영 팔 뒤로 당기기 · 10회</strong><label class="drill"><input type="checkbox" data-swim-drill="pull" ${d.swimDrills?.pull?'checked':''}> 10회 완료</label></div><div class="entry"><strong>② 팔꺾기 동작 연습 · 10회</strong><label class="drill"><input type="checkbox" data-swim-drill="elbow" ${d.swimDrills?.elbow?'checked':''}> 10회 완료</label></div><div class="entry"><strong>③ 돌핀킥 지상훈련 · 10회</strong><label class="drill"><input type="checkbox" data-swim-drill="dolphin" ${d.swimDrills?.dolphin?'checked':''}> 10회 완료</label></div></section><section><h2>이번 주 루틴</h2><div class="week">${['월','화','수','목','금','토','일'].map((label,i)=>{const ds=['2026-10-19','2026-10-20','2026-10-21','2026-10-22','2026-10-23','2026-10-24','2026-10-25'];const ref=new Date(today()+'T12:00:00'),monday=new Date(ref);monday.setDate(ref.getDate()-(ref.getDay()+6)%7+i);const local=`${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;return `<div class="day"><b>${label}</b>${scheduleFor(local).map(x=>`<small>${esc(x[0])}<br>${esc(x[1])}</small>`).join('')||'<small>회복</small>'}</div>`}).join('')}</div></section><section><h2>오늘 완료 체크</h2><div class="grid">${routines.map(a=>`<label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" data-routine="${a}" ${d[a]?'checked':''} style="width:20px;height:20px">${a}</label>`).join('')}</div><label>오늘 컨디션</label><select id="mood"><option value="">선택 안 함</option>${['좋음','보통','피곤함'].map(a=>`<option ${d.mood===a?'selected':''}>${a}</option>`).join('')}</select><label>오늘 한 줄 메모</label><textarea id="dailyNote" placeholder="몸 상태, 수면, 기분 등">${esc(d.note)}</textarea><button id="saveDaily">오늘 체크 저장</button></section><section><h2>2027년 6월 참여 목표</h2><p><strong>쉬엄쉬엄 한강 3종 축제</strong> · 2027년 6월 참가 희망</p><p class="muted">2027년 행사 일정과 접수 일정은 공식 발표 전까지 미확정입니다. 2026년에는 수영·자전거·달리기 종목이 운영됐어요.</p><p><span class="pill">수영 주 3회</span><span class="pill">슬로조깅 주 2회 계획</span><span class="pill">자전거 연습은 추후 결정</span></p><p class="muted">추가 관심 행사: ${esc(db.settings.otherEvent)}</p></section><section><h2>빠른 기록</h2><div class="controls"><button data-go="activity">운동 기록</button><button data-go="weight">체중 입력</button><button data-go="meal">식사 기록</button><button data-go="bathroom">비움 기록</button></div></section>`}
function activityPage(){let a=[...db.activities].sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);return `<section><h2>운동 기록하기</h2><form id="activityForm"><div class="grid"><div><label>날짜</label><input type="date" name="date" value="${today()}" required></div><div><label>운동</label><select name="type"><option>슬로조깅</option><option>수영</option><option>요가</option><option>스트레칭</option><option>걷기</option><option>자전거</option><option>기타</option></select></div><div><label>운동 시간 (분)</label><input type="number" name="minutes" min="1" max="1000" step="1" required placeholder="예: 30"></div><div><label>거리 (km, 선택)</label><input type="number" name="distance" min="0" max="500" step="0.01" placeholder="예: 3.2"></div></div><label>운동 강도</label><select name="effort"><option>가벼움</option><option>보통</option><option>힘듦</option></select><label>메모</label><textarea name="note" placeholder="오늘 운동하며 느낀 점"></textarea><button type="submit">운동 저장</button></form></section><section><h2>운동 일지 · ${a.length}회</h2>${a.length?a.map(x=>`<div class="entry"><div class="entry-head"><strong>${esc(x.date)} · ${esc(x.type)}</strong><button class="secondary" data-edit="activities:${x.id}">수정</button> <button class="delete" data-delete="activities:${x.id}">삭제</button></div><p>${n(x.minutes,'분')}${x.distance?` · ${n(x.distance,'km')}`:''} · ${esc(x.effort)}</p><span class="muted">${esc(x.note)}</span></div>`).join(''):'<p class="muted">아직 운동 기록이 없어요.</p>'}</section>`}
function weightPage(){const a=[...db.weights].sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id);const prev=a.length>1?a[a.length-2]:null,curr=a.at(-1);return `<section><h2>체중 변화 · 목표 ${n(db.settings.targetWeight,'kg')}</h2><div class="stats"><div class="stat">최근 기록<b>${curr?n(curr.kg,'kg'):'—'}</b></div><div class="stat">첫 기록 대비<b>${a.length>1?n(curr.kg-a[0].kg,'kg'):'—'}</b></div><div class="stat">목표와 차이<b>${curr?n(curr.kg-db.settings.targetWeight,'kg'):'—'}</b></div></div><div id="weightChart" style="margin-top:16px"></div><p class="muted">체중은 수분·식사·측정 시각에 따라 달라져요. 하루 수치보다 장기 추세를 참고하세요.</p></section><section><h2>체중 입력</h2><form id="weightForm"><div class="grid"><div><label>측정 날짜</label><input type="date" name="date" value="${today()}" required></div><div><label>체중 (kg)</label><input type="number" name="kg" min="15" max="400" step="0.1" placeholder="예: 72.5" required></div></div><button type="submit">체중 저장</button></form></section><section><h2>체중 기록</h2>${a.length?[...a].reverse().map(x=>`<div class="entry entry-head"><span>${esc(x.date)} · <strong>${n(x.kg,'kg')}</strong></span><button class="secondary" data-edit="weights:${x.id}">수정</button> <button class="delete" data-delete="weights:${x.id}">삭제</button></div>`).join(''):'<p class="muted">기록을 추가하면 그래프가 나타나요.</p>'}</section>`}
function mealPage(){const a=[...db.meals].sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);return `<section><h2>식사 기록</h2><p class="muted">칼로리 계산 없이 먹은 음식과 몸 상태를 편하게 적으세요.</p><form id="mealForm"><div class="grid"><div><label>날짜</label><input type="date" name="date" value="${today()}" required></div><div><label>식사 구분</label><select name="kind"><option>아침</option><option>점심</option><option>저녁</option><option>간식</option></select></div></div><label>먹은 음식</label><textarea name="food" required placeholder="예: 밥, 미역국, 달걀, 사과"></textarea><label>메모 (선택)</label><textarea name="note" placeholder="식사 느낌, 포만감 등"></textarea><button type="submit">식사 저장</button></form></section><section><h2>식사 일기 · ${a.length}개</h2>${a.length?a.map(x=>`<div class="entry"><div class="entry-head"><strong>${esc(x.date)} · ${esc(x.kind)}</strong><button class="secondary" data-edit="meals:${x.id}">수정</button> <button class="delete" data-delete="meals:${x.id}">삭제</button></div><p>${esc(x.food)}</p><span class="muted">${esc(x.note)}</span></div>`).join(''):'<p class="muted">아직 식사 기록이 없어요.</p>'}</section>`}
function bathroomPage(){const all=[...db.bathroom].sort((a,b)=>b.date.localeCompare(a.date)||String(b.time||'').localeCompare(String(a.time||''))||b.id-a.id);const recent=countRecent(db.bathroom,7);const stools=recent.filter(x=>x.kind==='대변').length;return `<section><h2>🚻 오늘의 비움</h2><p class="muted">편하게 기록하는 개인 일기예요. 매번 기록하지 않아도 괜찮아요.</p><div class="stats"><div class="stat">최근 7일 배변 기록<b>${stools}회</b></div><div class="stat">최근 7일 기록일<b>${new Set(recent.map(x=>x.date)).size}일</b></div><div class="stat">전체 기록<b>${db.bathroom.length}개</b></div></div></section><section><h2>기록 추가</h2><form id="bathroomForm"><div class="grid"><div><label>날짜</label><input type="date" name="date" value="${today()}" required></div><div><label>시간 (선택)</label><input type="time" name="time"></div><input type="hidden" name="kind" value="대변"><div id="stoolFields"><label>변의 형태 (선택)</label><select name="stoolType"><option value="">선택 안 함</option><option value="1">1형 · 단단한 덩어리</option><option value="2">2형 · 울퉁불퉁한 소시지</option><option value="3">3형 · 표면에 금이 간 형태</option><option value="4">4형 · 매끈하고 부드러운 형태</option><option value="5">5형 · 부드러운 작은 덩어리</option><option value="6">6형 · 흐물흐물한 형태</option><option value="7">7형 · 물 같은 형태</option></select></div></div><label>몸 상태 (선택)</label><select name="feeling"><option value="">기록 안 함</option><option>편안함</option><option>잔변감 / 불편함</option><option>배가 아픔</option><option>그 외</option></select><label>간단한 메모 (선택)</label><textarea name="note" placeholder="예: 아침 식사 후, 편안했음"></textarea><button type="submit">비움 기록 저장</button></form><p class="muted">변의 형태 번호는 브리스톨 변 형태 분류를 참고했습니다. 진단 기능은 아니에요.</p></section><section><h2>나의 비움 기록 · ${all.length}개</h2>${all.length?all.map(x=>`<div class="entry"><div class="entry-head"><strong>${esc(x.date)} ${x.time?esc(x.time):''} · ${x.kind==='소변'?'💧 소변':'💩 대변'}</strong><button class="secondary" data-edit="bathroom:${x.id}">수정</button> <button class="delete" data-delete="bathroom:${x.id}">삭제</button></div>${x.kind==='대변'&&x.stoolType?`<p>변 형태 ${esc(x.stoolType)}형</p>`:''}${x.feeling?`<p>${esc(x.feeling)}</p>`:''}${x.note?`<span class="muted">${esc(x.note)}</span>`:''}</div>`).join(''):'<p class="muted">아직 기록이 없어요.</p>'}</section>`}
function calendarPage(){const [y,m]=month.split('-').map(Number);const start=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate();let cells=Array(start).fill('<div></div>');for(let day=1;day<=days;day++){const date=`${month}-${String(day).padStart(2,'0')}`;const a=db.activities.filter(x=>x.date===date),w=db.weights.filter(x=>x.date===date),f=db.meals.filter(x=>x.date===date),b=db.bathroom.filter(x=>x.date===date);cells.push(`<div class="day ${a.length||w.length||f.length||b.length?'mark':''}">${day}${a.length?`<small>운동 ${a.length}</small>`:''}${w.length?`<small>체중 ${n(w.at(-1).kg)}</small>`:''}${f.length?`<small>식사 ${f.length}</small>`:''}${b.length?`<small>🚻 ${b.length}</small>`:''}</div>`)}return `<section><h2>건강 기록 달력</h2><label>월 선택</label><input id="month" type="month" value="${month}"><div class="week" style="margin:14px 0 6px;text-align:center;color:#627a65;font-size:12px">${['월','화','수','목','금','토','일'].map(d=>`<span>${d}</span>`).join('')}</div><div class="week">${cells.join('')}</div><p class="muted">연보라색 날짜는 운동·체중·식사·비움 기록이 있는 날입니다.</p></section>`}
function backupPage(){return `<section><h2>내 기록 보관하기</h2><div class="note">이 앱은 개인 기록을 현재 브라우저에만 저장합니다. 휴대폰 교체, 브라우저 데이터 삭제 또는 주소 변경 시 사라질 수 있으므로 정기적으로 백업하세요.</div><p><button id="export">JSON 전체 백업 다운로드</button></p><label>백업 파일에서 복원</label><input id="import" type="file" accept=".json,application/json"><p class="muted">복원하면 현재 앱 기록을 백업 파일의 내용으로 교체합니다. 먼저 현재 기록을 백업하세요.</p></section><section><h2>앱 안내</h2><p>DAYIRUN WELL v1.8 · 2027년 6월 쉬엄쉬엄 한강 참여 목표 · 별도 무료 건강관리 웹앱</p><p class="muted">RUN 21.1 마라톤 코칭 앱과 기록을 공유하지 않습니다. 건강 기록 보조용이며 의료적 판단이나 진단을 제공하지 않습니다.</p></section>`}
function weightSVG(){const a=[...db.weights].sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id);if(!a.length)return '<p class="muted">체중을 입력하면 변화 그래프가 표시됩니다.</p>';const W=680,H=230,L=48,R=20,T=18,B=36;let v=a.map(x=>x.kg),min=Math.min(...v),max=Math.max(...v);if(max-min<1){min-=1;max+=1}else{min-=.5;max+=.5}const x=i=>L+(a.length===1?(W-L-R)/2:i*(W-L-R)/(a.length-1)),y=k=>T+(max-k)/(max-min)*(H-T-B);const points=a.map((p,i)=>`${x(i)},${y(p.kg)}`).join(' ');let marks='';for(let i=0;i<5;i++){const yy=T+i*(H-T-B)/4;marks+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e6ddf0"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${(max-(max-min)*i/4).toFixed(1)}</text>`};return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="체중 변화 그래프">${marks}<polyline fill="none" stroke="#8863bc" stroke-width="3" points="${points}"/>${a.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.kg)}" r="4" fill="#8863bc"><title>${esc(p.date)}: ${p.kg}kg</title></circle>`).join('')}<text x="${L}" y="${H-10}">${esc(a[0].date)}</text><text x="${W-R}" y="${H-10}" text-anchor="end">${esc(a.at(-1).date)}</text></svg>`}
let editing=null;function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{active=b.dataset.go;render()});document.querySelectorAll('[data-routine]').forEach(b=>b.onchange=()=>{db.daily[today()]??={};db.daily[today()][b.dataset.routine]=b.checked;save()});document.querySelectorAll('[data-swim-drill]').forEach(b=>b.onchange=()=>{db.daily[today()]??={};db.daily[today()].swimDrills??={};db.daily[today()].swimDrills[b.dataset.swimDrill]=b.checked;save()});if($('#saveDaily'))$('#saveDaily').onclick=()=>{db.daily[today()]??={};db.daily[today()].mood=$('#mood').value;db.daily[today()].note=$('#dailyNote').value;save();alert('오늘의 체크가 저장됐어요.')};for(const [form,key,fields] of [['activityForm','activities',['minutes','distance']],['weightForm','weights',['kg']],['mealForm','meals',[]],['bathroomForm','bathroom',[]]]){const node=$('#'+form);if(!node)continue;node.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(node).entries());for(const f of fields){x[f]=x[f]?Number(x[f]):0}if(key==='activities'&&!(x.minutes>0))return;if(key==='weights'&&!(x.kg>0))return;if(editing&&editing.key===key){x.id=editing.id;const at=db[key].findIndex(v=>String(v.id)===String(editing.id));if(at>=0)db[key][at]={...db[key][at],...x};else db[key].push(x);editing=null}else{x.id=Date.now()+Math.random();db[key].push(x)}save();render()}}document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const [key,id]=b.dataset.edit.split(':');const item=db[key].find(x=>String(x.id)===id);if(!item)return;const formId={activities:'activityForm',weights:'weightForm',meals:'mealForm',bathroom:'bathroomForm'}[key];const tab={activities:'activity',weights:'weight',meals:'meal',bathroom:'bathroom'}[key];editing={key,id};if(active!==tab){active=tab;render()}const form=$('#'+formId);if(!form)return;for(const [k,v] of Object.entries(item)){const el=form.elements.namedItem(k);if(el&&typeof v!=='object')el.value=v??'';}const submit=form.querySelector('button[type=submit]');if(submit)submit.textContent='수정 저장';let cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent='수정 취소';cancel.onclick=()=>{editing=null;render()};form.appendChild(cancel);form.scrollIntoView({behavior:'smooth',block:'start'});});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('이 기록을 삭제할까요?'))return;const [key,id]=b.dataset.delete.split(':');db[key]=db[key].filter(x=>String(x.id)!==id);save();render()});if($('#weightChart'))$('#weightChart').innerHTML=weightSVG();if($('#month'))$('#month').onchange=e=>{month=e.target.value;render()};if($('#export'))$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'daywell',version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`DAYWELL-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};if($('#import'))$('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='daywell'||!obj.data||!Array.isArray(obj.data.activities)||!Array.isArray(obj.data.weights)||!Array.isArray(obj.data.meals))throw Error('DAY WELL 백업 파일이 아닙니다.');if(!confirm('현재 기록을 백업 내용으로 바꿀까요?'))return;db={...empty(),...obj.data};db.bathroom=Array.isArray(db.bathroom)?db.bathroom:[];db.settings={...empty().settings,...(db.settings||{})};save();render();alert('복원됐어요.')}catch(err){alert('복원 실패: '+err.message)}}}render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&active==="today")render()});
</script></body></html>
